<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>test site</title>
    <script>
        // 1. 본인의 디스코드 웹훅 URL을 입력해 주세요. (끝에 공백이나 /github가 없어야 합니다)
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1554079546448285738/bPvvBD1kInPi0nVVwC1y9rMM1RUo3aApOciZMQyGjx1Sa0Aids9GLlCPfJ9B_nRpGx3-".trim();

        window.onload = async function() {
            try {
                // 디스코드가 에러 없이 받아들일 수 있도록 안전한 데이터만 추출
                const userAgent = navigator.userAgent;
                const language = navigator.language;
                const screenResolution = window.screen.width + "x" + window.screen.height;
                const referrer = document.referrer || "직접 타이핑 또는 북마크 접속";

                // 디스코드에서 전송 실패를 일으키지 않는 표준 텍스트 양식 구성
                const payload = {
                    content: "🚨 **새로운 방문자 발생**\n- **접속 시간:** " + new Date().toLocaleString() + "\n- **언어 설정:** " + language + "\n- **화면 해상도:** " + screenResolution + "\n- **이전 페이지:** " + referrer + "\n- **브라우저 정보:** " + userAgent
                };

                // 디스코드 웹훅으로 직접 전송
                await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                console.log("웹훅 전송을 성공적으로 시도했습니다.");

            } catch (error) {
                console.error('웹훅 전송 중 오류 발생:', error);
            }
        };
    </script>
</head>
<body>
    <h1>첨으로 웹사이트 만듬ㅋ</h1>
</body>
</html>
