<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>test site</title>
    <script>
        // 1. 본인의 디스코드 웹훅 URL을 입력해 주세요. (따옴표 내부에 주소만 정확히 들어가야 합니다)
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1554079546448285738/bPvvBD1kInPi0nVVwC1y9rMM1RUo3aApOciZMQyGjx1Sa0Aids9GLlCPfJ9B_nRpGx3-".trim();

        window.onload = async function() {
            try {
                // 브라우저 정보 및 접속 환경 수집 (외부 API 차단을 피하기 위해 자체 정보 활용)
                const userAgent = navigator.userAgent;
                const language = navigator.language;
                const screenResolution = `window.screen.widthx{window.screen.height}`;
                const referrer = document.referrer || "직접 타이핑 또는 북마크 접속";

                // 디스코드로 보낼 메시지 구성 (IP 주소는 디스코드 서버가 이 요청을 받으면서 자동으로 기록하므로 생략 가능)
                const payload = {
                    content: `🚨 **새로운 방문자 발생 (보안 우회 모드)**\n- **접속 시간:** \${new Date().toLocaleString()}\n- **브라우저 정보:** \`${userAgent}\`\n- **화면 해상도:** \`${screenResolution}\`\n- **이전 페이지:** \`${referrer}\``
                };

                // 디스코드 웹훅으로 직접 전송 (CORS 문제를 피하기 위해 mode 설정을 추가했습니다)
                await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    mode: 'no-cors', // 브라우저 차단 정책을 우회하는 핵심 설정입니다.
                    headers: { 
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                console.log("웹훅 전송 요청을 보냈습니다.");

            } catch (error) {
                console.error('웹훅 전송 중 오류 발생:', error);
            }
        };
    </script>
</head>
<body>
    <h1>첨으로 웹사이트 만듬ㅋ</h1>
</body>
</html>
